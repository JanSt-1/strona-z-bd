        // Komponent panelu zarządzania kontami użytkowników (tylko dla roli admin)
        function AdminUsersPanel({ currentUser, apiJson, showAlert }) {
            const [users, setUsers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [searchTerm, setSearchTerm] = useState('');
            const [passwordModalUser, setPasswordModalUser] = useState(null);
            const [showCreateForm, setShowCreateForm] = useState(false);
            const [actionInProgressId, setActionInProgressId] = useState(null);

            // Formularz nowego konta
            const [newUsername, setNewUsername] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [newRole, setNewRole] = useState('pracownik');
            const [creating, setCreating] = useState(false);
            const [createError, setCreateError] = useState(null);

            async function fetchUsers() {
                setLoading(true);
                try {
                    const data = await apiJson('/admin/users', {}, 'Błąd podczas pobierania listy użytkowników.');
                    if (Array.isArray(data)) {
                        setUsers(data);
                    }
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            }

            useEffect(() => {
                fetchUsers();
            }, []);

            // Zmiana roli konta
            async function handleRoleChange(targetUser, nextRole) {
                if (targetUser.id === currentUser.id && nextRole !== 'admin') {
                    showAlert('Nie możesz odebrać roli administratora samemu sobie!', 'error');
                    return;
                }
                setActionInProgressId(targetUser.id);
                try {
                    const data = await apiJson(`/admin/users/${targetUser.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ role: nextRole })
                    }, 'Nie udało się zmienić roli użytkownika.');
                    if (!data) return;

                    showAlert(data.message, 'success');
                    setUsers(prev => prev.map(u => u.id === targetUser.id ? { ...u, role: nextRole } : u));
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    setActionInProgressId(null);
                }
            }

            // Przełączanie statusu aktywny/zablokowany
            async function handleToggleStatus(targetUser) {
                if (targetUser.id === currentUser.id && targetUser.aktywny) {
                    showAlert('Nie możesz zablokować własnego konta administratora!', 'error');
                    return;
                }
                const confirmMsg = targetUser.aktywny
                    ? `Czy na pewno chcesz zablokować konto "${targetUser.username}"? Użytkownik straci możliwość logowania.`
                    : `Czy chcesz odblokować konto "${targetUser.username}"?`;
                if (!window.confirm(confirmMsg)) return;

                setActionInProgressId(targetUser.id);
                try {
                    const data = await apiJson(`/admin/users/${targetUser.id}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ aktywny: !targetUser.aktywny })
                    }, 'Nie udało się zmienić statusu konta.');
                    if (!data) return;

                    showAlert(data.message, 'success');
                    setUsers(prev => prev.map(u => u.id === targetUser.id ? { ...u, aktywny: data.aktywny } : u));
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    setActionInProgressId(null);
                }
            }

            // Utworzenie nowego użytkownika
            async function handleCreateUser(e) {
                e.preventDefault();
                setCreateError(null);
                if (!newUsername.trim() || !newPassword) {
                    setCreateError('Wypełnij nazwę użytkownika oraz hasło.');
                    return;
                }
                if (newPassword.length < 8) {
                    setCreateError('Hasło musi mieć co najmniej 8 znaków.');
                    return;
                }
                setCreating(true);
                try {
                    const data = await apiJson('/admin/users', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: newUsername.trim(),
                            password: newPassword,
                            role: newRole
                        })
                    }, 'Nie udało się utworzyć użytkownika.');
                    if (!data) return;

                    showAlert(`Użytkownik "${newUsername.trim()}" został utworzony.`, 'success');
                    setNewUsername('');
                    setNewPassword('');
                    setNewRole('pracownik');
                    setShowCreateForm(false);
                    fetchUsers();
                } catch (err) {
                    setCreateError(err.message);
                } finally {
                    setCreating(false);
                }
            }

            const filteredUsers = users.filter(u => {
                const q = searchTerm.toLowerCase();
                return u.username.toLowerCase().includes(q) || u.role.toLowerCase().includes(q);
            });

            const totalCount = users.length;
            const activeCount = users.filter(u => u.aktywny).length;
            const blockedCount = users.filter(u => !u.aktywny).length;
            const adminCount = users.filter(u => u.role === 'admin').length;

            return (
                <div>
                    {/* Statystyki podsumowujące */}
                    <div className="user-stats-bar">
                        <div className="stat-card">
                            <span className="stat-number">{totalCount}</span>
                            <span className="stat-label">Wszystkie konta</span>
                        </div>
                        <div className="stat-card">
                            <span className="stat-number" style={{ color: '#047857' }}>{activeCount}</span>
                            <span className="stat-label">Aktywne</span>
                        </div>
                        <div className="stat-card">
                            <span className="stat-number" style={{ color: '#b91c1c' }}>{blockedCount}</span>
                            <span className="stat-label">Zablokowane</span>
                        </div>
                        <div className="stat-card">
                            <span className="stat-number" style={{ color: '#1e40af' }}>{adminCount}</span>
                            <span className="stat-label">Administratorzy</span>
                        </div>
                    </div>

                    {/* Wyszukiwarka i przycisk tworzenia nowego konta */}
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.75rem', marginBottom: '1.25rem' }}>
                        <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center', flex: '1', maxWidth: '350px' }}>
                            <input
                                type="text"
                                placeholder="Filtruj użytkowników..."
                                value={searchTerm}
                                onChange={e => setSearchTerm(e.target.value)}
                                style={{ padding: '0.55rem 0.8rem', fontSize: '0.88rem' }}
                            />
                        </div>
                        <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                            <button
                                type="button"
                                className="nav-btn"
                                onClick={fetchUsers}
                                title="Odśwież listę kont"
                            >
                                Odśwież listę
                            </button>
                            <button
                                type="button"
                                className="btn-submit"
                                style={{ padding: '0.6rem 1.1rem', fontSize: '0.88rem' }}
                                onClick={() => setShowCreateForm(prev => !prev)}
                            >
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                {showCreateForm ? 'Ukryj formularz' : 'Nowe konto użytkownika'}
                            </button>
                        </div>
                    </div>

                    {/* Formularz tworzenia nowego użytkownika */}
                    {showCreateForm && (
                        <div className="form-section" style={{ animation: 'fadeIn 0.25s ease-out' }}>
                            <div className="form-section-header">
                                <span className="form-section-badge">+</span>
                                <h3 className="form-section-title">Dodaj nowe konto użytkownika</h3>
                            </div>
                            {createError && (
                                <div className="alert alert-error">{createError}</div>
                            )}
                            <form onSubmit={handleCreateUser}>
                                <div className="form-grid">
                                    <div className="form-group">
                                        <label>Nazwa użytkownika (login) *</label>
                                        <input
                                            type="text"
                                            required
                                            maxLength="50"
                                            placeholder="np. jankowalski"
                                            value={newUsername}
                                            onChange={e => setNewUsername(e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Hasło (min. 8 znaków) *</label>
                                        <input
                                            type="password"
                                            required
                                            minLength="8"
                                            placeholder="Wpisz hasło (min. 8 znaków)..."
                                            value={newPassword}
                                            onChange={e => setNewPassword(e.target.value)}
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label>Rola *</label>
                                        <select
                                            value={newRole}
                                            onChange={e => setNewRole(e.target.value)}
                                        >
                                            <option value="pracownik">pracownik (wyłącznie przypisane zadania)</option>
                                            <option value="serwisant">serwisant (przypisywanie i naprawa)</option>
                                            <option value="magazynier">magazynier (wysyłka i listy przewozowe)</option>
                                            <option value="admin">admin (pełny dostęp do systemu)</option>
                                        </select>
                                    </div>
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.75rem', marginTop: '1rem' }}>
                                    <button
                                        type="button"
                                        className="btn-reset"
                                        onClick={() => setShowCreateForm(false)}
                                    >
                                        Anuluj
                                    </button>
                                    <button
                                        type="submit"
                                        className="btn-submit"
                                        disabled={creating}
                                    >
                                        {creating ? 'Tworzenie konta...' : 'Utwórz konto'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Tabela użytkowników */}
                    <div className="tickets-table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th style={{ width: '50px' }}>ID</th>
                                    <th style={{ minWidth: '160px' }}>Użytkownik</th>
                                    <th style={{ minWidth: '150px' }}>Rola</th>
                                    <th style={{ minWidth: '120px' }}>Status</th>
                                    <th style={{ minWidth: '140px' }}>Data utworzenia</th>
                                    <th style={{ minWidth: '220px' }}>Akcje administratora</th>
                                </tr>
                            </thead>
                            <tbody>
                                {loading ? (
                                    <tr>
                                        <td colSpan="6" style={{ textAlign: 'center', padding: '2rem' }}>
                                            Ładowanie listy użytkowników...
                                        </td>
                                    </tr>
                                ) : filteredUsers.length === 0 ? (
                                    <tr>
                                        <td colSpan="6" style={{ textAlign: 'center', padding: '2rem', color: '#ffffff' }}>
                                            {searchTerm ? 'Nie znaleziono kont spełniających kryteria.' : 'Brak kont użytkowników w bazie.'}
                                        </td>
                                    </tr>
                                ) : (
                                    filteredUsers.map(u => {
                                        const isSelf = u.id === currentUser?.id;
                                        const isBusy = actionInProgressId === u.id;
                                        return (
                                            <tr key={u.id} style={{ opacity: u.aktywny ? 1 : 0.65 }}>
                                                <td><strong>#{u.id}</strong></td>
                                                <td>
                                                    <span style={{ fontWeight: 600, fontSize: '0.92rem' }}>{u.username}</span>
                                                    {isSelf && (
                                                        <span className="badge-self" title="Aktualnie zalogowany administrator">Ty</span>
                                                    )}
                                                </td>
                                                <td>
                                                    <select
                                                        className="status-select"
                                                        value={u.role}
                                                        disabled={isBusy || (isSelf && u.role === 'admin')}
                                                        onChange={e => handleRoleChange(u, e.target.value)}
                                                        title={isSelf ? 'Nie możesz odebrać roli administratora samemu sobie' : 'Zmień rolę użytkownika'}
                                                        style={{ fontWeight: 600 }}
                                                    >
                                                        <option value="pracownik">pracownik</option>
                                                        <option value="serwisant">serwisant</option>
                                                        <option value="magazynier">magazynier</option>
                                                        <option value="admin">admin</option>
                                                    </select>
                                                </td>
                                                <td>
                                                    {u.aktywny ? (
                                                        <span className="badge-status-active">
                                                            ● Aktywny
                                                        </span>
                                                    ) : (
                                                        <span className="badge-status-blocked">
                                                            ✕ Zablokowany
                                                        </span>
                                                    )}
                                                </td>
                                                <td>
                                                    <small style={{ color: '#000000' }}>
                                                        {u.created_at ? new Date(u.created_at).toLocaleString('pl-PL') : '-'}
                                                    </small>
                                                </td>
                                                <td>
                                                    <div style={{ display: 'flex', gap: '0.45rem', flexWrap: 'wrap', alignItems: 'center' }}>
                                                        {/* Przełącznik blokady */}
                                                        <button
                                                            type="button"
                                                            className={`btn-action-small ${u.aktywny ? 'btn-block' : 'btn-unblock'}`}
                                                            disabled={isBusy || isSelf}
                                                            onClick={() => handleToggleStatus(u)}
                                                            title={isSelf ? 'Nie możesz zablokować własnego konta administratora' : (u.aktywny ? 'Zablokuj konto temu użytkownikowi' : 'Odblokuj konto')}
                                                        >
                                                            {u.aktywny ? (
                                                                <>
                                                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                                                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                                                    </svg>
                                                                    Zablokuj
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                                                        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                                                                    </svg>
                                                                    Odblokuj
                                                                </>
                                                            )}
                                                        </button>

                                                        {/* Ustawienie nowego hasła */}
                                                        <button
                                                            type="button"
                                                            className="btn-action-small btn-password"
                                                            disabled={isBusy}
                                                            onClick={() => setPasswordModalUser(u)}
                                                            title="Ustaw nowe hasło dla tego konta"
                                                        >
                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                                                <path d="M21 2l-2 2m-1.5 1.5L14 9l-1.5-1.5L10 10l1.5 1.5L4 19l-2 3 3-2 7.5-7.5 1.5 1.5 2.5-2.5-1.5-1.5 3.5-3.5 2-2z"></path>
                                                            </svg>
                                                            Zmień hasło
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal zmiany hasła */}
                    {passwordModalUser && (
                        <AdminPasswordModal
                            userToEdit={passwordModalUser}
                            onClose={() => setPasswordModalUser(null)}
                            onPasswordChanged={fetchUsers}
                            apiJson={apiJson}
                            showAlert={showAlert}
                        />
                    )}
                </div>
            );
        }

        // Panel zarządzania zgłoszeniami dla zalogowanego pracownika / serwisanta / magazyniera / admina
        function Dashboard({ user, token, onLogout }) {
            const [tickets, setTickets] = useState([]);
            const [workers, setWorkers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [deletingId, setDeletingId] = useState(null);
            const [alert, setAlert] = useState(null);
            const [repairModalTicket, setRepairModalTicket] = useState(null);
            const [dashboardTab, setDashboardTab] = useState('tickets'); // 'tickets' | 'users'
            const [showOwnPasswordModal, setShowOwnPasswordModal] = useState(false);

            function showAlert(message, type = 'success') {
                setAlert({ message, type });
                setTimeout(() => setAlert(null), 5000);
            }

            function handleAuthError(response) {
                if (response && response.status === 401) {
                    onLogout();
                    return true;
                }
                return false;
            }

            async function apiFetch(endpoint, options = {}) {
                const currentToken = localStorage.getItem('serwis_token');
                const headers = {
                    ...(options.headers || {}),
                    'Authorization': `Bearer ${currentToken || ''}`
                };
                const url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
                const response = await fetch(url, { ...options, headers });

                if (handleAuthError(response)) {
                    return null;
                }

                return response;
            }

            async function fetchWorkers() {
                if (user?.role !== 'admin' && user?.role !== 'serwisant') return;
                try {
                    const response = await apiFetch('/pracownicy');
                    if (!response || !response.ok) return;
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        setWorkers(data);
                    }
                } catch (err) {
                    console.error('Błąd pobierania pracowników:', err);
                }
            }

            // apiFetch + odczyt JSON; zwraca null przy błędzie autoryzacji, a przy !response.ok rzuca błąd
            async function apiJson(endpoint, options, fallbackError) {
                const response = await apiFetch(endpoint, options);
                if (!response) return null;

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || fallbackError);
                }
                return data;
            }

            async function fetchTickets() {
                setLoading(true);
                try {
                    const data = await apiJson('/zgloszenia', {}, 'Błąd podczas pobierania zgłoszeń.');
                    if (!data) return;

                    setTickets(Array.isArray(data) ? data : []);
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            }

            useEffect(() => {
                fetchTickets();
                fetchWorkers();
            }, [token]);

            async function handleAssignWorker(ticketId, pracownikId) {
                try {
                    const data = await apiJson(`/zgloszenia/${ticketId}/przypisz`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pracownik_id: pracownikId || null })
                    }, 'Nie udało się przypisać pracownika.');
                    if (!data) return;

                    showAlert(data.message, 'success');
                    fetchTickets();
                } catch (err) {
                    showAlert(err.message, 'error');
                }
            }

            async function handleRepairSubmit(ticketId, opisNaprawy) {
                try {
                    const data = await apiJson(`/zgloszenia/${ticketId}/naprawione`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ opis_naprawy: opisNaprawy })
                    }, 'Nie udało się zatwierdzić naprawy.');
                    if (!data) return;

                    showAlert(`Zgłoszenie #${ticketId} zostało opisane i przekazane do magazynu jako "Do wysyłki"!`, 'success');
                    setRepairModalTicket(null);
                    fetchTickets();
                } catch (err) {
                    showAlert(err.message, 'error');
                    fetchTickets();
                    throw err;
                }
            }

            async function handleUpdateStatus(id, newStatus, extraData) {
                try {
                    const body = { status: newStatus, ...extraData };
                    const data = await apiJson(`/zgloszenia/${id}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    }, 'Nie udało się zaktualizować statusu.');
                    if (!data) return;

                    showAlert(`Zgłoszenie #${id}: zmieniono status na "${newStatus}".`, 'success');
                    fetchTickets();
                } catch (err) {
                    showAlert(err.message, 'error');
                }
            }

            async function handleDeleteTicket(id) {
                if (user?.role !== 'admin') {
                    showAlert('Brak uprawnień do usuwania zgłoszeń (wymagana rola: admin).', 'error');
                    return;
                }
                const confirmed = window.confirm(`Czy na pewno chcesz bezpowrotnie usunąć zgłoszenie #${id}?`);
                if (!confirmed) return;

                setDeletingId(id);
                try {
                    const data = await apiJson(`/zgloszenia/${id}`, {
                        method: 'DELETE'
                    }, 'Nie udało się usunąć zgłoszenia.');
                    if (!data) return;

                    showAlert(`Zgłoszenie #${id} zostało pomyślnie usunięte.`, 'success');
                    setTickets(prev => prev.filter(t => t.id !== id));
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    setDeletingId(null);
                }
            }

            const getEmptyMessage = () => {
                if (user?.role === 'pracownik') {
                    return 'Brak przypisanych zleceń. Zlecenia pojawią się tutaj po przypisaniu ich przez serwisanta lub administratora.';
                }
                if (user?.role === 'magazynier') {
                    return 'Brak zleceń oczekujących na wysyłkę. Zlecenia pojawią się tutaj ze statusem "Do wysyłki", gdy pracownik zakończy i opisze naprawę.';
                }
                return 'Brak zgłoszeń w bazie danych.';
            };

            const currentTab = user?.role === 'admin' ? dashboardTab : 'tickets';

            return (
                <div className="card">
                    <div className="admin-header-bar">
                        <div>
                            <h2 className="card-title">
                                {currentTab === 'users' ? 'Użytkownicy (Zarządzanie kontami)' : 'Zgłoszenia serwisowe'}
                            </h2>
                            <span className="badge-user">
                                Zalogowano: {user?.username || 'Użytkownik'} (Rola: {user?.role || 'pracownik'})
                            </span>
                        </div>
                        <div style={{ display: 'flex', gap: '0.65rem', alignItems: 'center', flexWrap: 'wrap' }}>
                            <button
                                type="button"
                                className="nav-btn"
                                onClick={() => setShowOwnPasswordModal(true)}
                                title="Zmień swoje hasło logowania"
                                style={{ display: 'inline-flex', alignItems: 'center', gap: '0.35rem' }}
                            >
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                Zmień hasło
                            </button>
                            <button className="nav-btn" onClick={currentTab === 'users' ? () => {} : fetchTickets}>
                                Odśwież
                            </button>
                            <button className="btn-logout" onClick={onLogout}>
                                Wyloguj
                            </button>
                        </div>
                    </div>

                    {/* Zakładki panelu dla administratora */}
                    {user?.role === 'admin' && (
                        <div className="dashboard-subnav">
                            <button
                                type="button"
                                className={`dashboard-subnav-btn ${currentTab === 'tickets' ? 'active' : ''}`}
                                onClick={() => setDashboardTab('tickets')}
                            >
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                Zgłoszenia serwisowe ({tickets.length})
                            </button>
                            <button
                                type="button"
                                className={`dashboard-subnav-btn ${currentTab === 'users' ? 'active' : ''}`}
                                onClick={() => setDashboardTab('users')}
                            >
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                                Zarządzanie użytkownikami (Admin)
                            </button>
                        </div>
                    )}

                    <Alert alert={alert} />

                    {currentTab === 'users' && user?.role === 'admin' ? (
                        <AdminUsersPanel
                            currentUser={user}
                            apiJson={apiJson}
                            showAlert={showAlert}
                        />
                    ) : (
                        <>

                    <div className="tickets-table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th style={{ width: '45px' }}>ID</th>
                                    <th style={{ minWidth: '150px' }}>Klient &amp; Kontakt</th>
                                    <th style={{ minWidth: '120px' }}>Adres</th>
                                    <th style={{ minWidth: '220px', maxWidth: '340px' }}>Przedmiot &amp; Usterka</th>
                                    <th style={{ minWidth: '140px' }}>Przypisany pracownik</th>
                                    <th style={{ minWidth: '220px', maxWidth: '340px' }}>Raport z naprawy</th>
                                    <th style={{ minWidth: '110px' }}>Nr FV &amp; NIP</th>
                                    <th style={{ minWidth: '130px' }}>Status</th>
                                    <th style={{ minWidth: '130px' }}>Data</th>
                                    <th style={{ minWidth: '80px' }}>Akcje</th>
                                </tr>
                            </thead>
                            <tbody>
                                {loading ? (
                                    <tr>
                                        <td colSpan="10" style={{ textAlign: 'center', color: 'var(--text-muted)' }}>
                                            Ładowanie danych z bazy MySQL...
                                        </td>
                                    </tr>
                                ) : tickets.length === 0 ? (
                                    <tr>
                                        <td colSpan="10" style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '2rem 1rem' }}>
                                            {getEmptyMessage()}
                                        </td>
                                    </tr>
                                ) : (
                                    tickets.map(t => (
                                        <tr key={t.id}>
                                            <td><strong>#{t.id}</strong></td>
                                            <td>
                                                <div><strong>{t.imie} {t.nazwisko}</strong></div>
                                                {t.nazwa_firmy && (
                                                    <div style={{ fontSize: '0.8rem', color: 'var(--primary)', fontWeight: 600 }}>
                                                        Nazwa firmy: {t.nazwa_firmy}
                                                    </div>
                                                )}
                                                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{t.email}</div>
                                                <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{t.numer_telefonu}</div>
                                            </td>
                                            <td>
                                                <div><small>{t.adres}</small></div>
                                                {(t.kod_pocztowy || t.miasto) && (
                                                    <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                                                        {t.kod_pocztowy} {t.miasto}
                                                    </div>
                                                )}
                                                {t.wojewodztwo && (
                                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', textTransform: 'capitalize' }}>
                                                        woj. {t.wojewodztwo}
                                                    </div>
                                                )}
                                            </td>
                                            <td>
                                                {t.przedmiot_zgloszenia && (
                                                    <div style={{ fontWeight: 600, color: 'var(--primary)', marginBottom: '3px' }}>
                                                        Produkt: {t.przedmiot_zgloszenia}
                                                    </div>
                                                )}
                                                {t.numer_seryjny && (
                                                    <div style={{ fontSize: '0.78rem', color: '#1f2937', fontWeight: 600, marginBottom: '2px' }}>
                                                        SN: {t.numer_seryjny}
                                                    </div>
                                                )}
                                                {t.data_zakupu && (
                                                    <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginBottom: '4px' }}>
                                                        Data Zakupu: {t.data_zakupu}
                                                    </div>
                                                )}
                                                <div style={{
                                                    whiteSpace: 'pre-wrap',
                                                    wordBreak: 'break-word',
                                                    overflowWrap: 'break-word',
                                                    fontSize: '0.85rem',
                                                    lineHeight: '1.45',
                                                    color: 'var(--text-main)',
                                                    marginTop: '4px'
                                                }}>
                                                    {t.opis_usterki}
                                                </div>
                                            </td>
                                            <td>
                                                {(user?.role === 'admin' || user?.role === 'serwisant') ? (
                                                    <select
                                                        className="assign-select"
                                                        value={t.przypisany_pracownik_id || ''}
                                                        onChange={e => handleAssignWorker(t.id, e.target.value)}
                                                        title="Przypisz to zlecenie pracownikowi"
                                                    >
                                                        <option value="">— Nieprzypisane —</option>
                                                        {workers.map(w => (
                                                            <option key={w.id} value={w.id}>
                                                                {w.username} ({w.role})
                                                            </option>
                                                        ))}
                                                    </select>
                                                ) : (
                                                    <div>
                                                        {t.przypisany_pracownik_username ? (
                                                            <span style={{ fontWeight: 600, color: 'var(--primary)', fontSize: '0.85rem' }}>
                                                                👤 {t.przypisany_pracownik_username}
                                                            </span>
                                                        ) : (
                                                            <span style={{ color: 'var(--text-muted)', fontSize: '0.8rem' }}>
                                                                Nieprzypisane
                                                            </span>
                                                        )}
                                                    </div>
                                                )}
                                            </td>
                                            <td>
                                                {t.opis_naprawy ? (
                                                    <div className="repair-box">
                                                        <div style={{ fontWeight: 600, color: ' var(--primary)', marginBottom: '2px' }}>
                                                            Naprawiono:
                                                        </div>
                                                        <div style={{
                                                            whiteSpace: 'pre-wrap',
                                                            wordBreak: 'break-word',
                                                            overflowWrap: 'break-word',
                                                            fontSize: '0.82rem',
                                                            lineHeight: '1.45',
                                                            margin: 0
                                                        }}>
                                                            {t.opis_naprawy}
                                                        </div>
                                                        {t.opis_naprawy_data && (
                                                            <div className="repair-date">
                                                                {t.opis_naprawy_data}
                                                            </div>
                                                        )}
                                                    </div>
                                                ) : (
                                                    <div>
                                                        {((user?.role === 'pracownik' && t.status === 'w_realizacji') || user?.role === 'admin') && t.status !== 'zakończone' ? (
                                                            <button
                                                                type="button"
                                                                className="btn-repair"
                                                                onClick={() => setRepairModalTicket(t)}
                                                                title="Wpisz co zostało zrobione i przekaż do wysyłki"
                                                            >
                                                                Opisz naprawę
                                                            </button>
                                                        ) : (
                                                            <span style={{ color: 'var(--text-muted)', fontSize: '0.8rem' }}>
                                                                {user?.role === 'pracownik' && t.status === 'nowe' ? 'Wymaga rozpoczęcia' : 'Oczekuje na opis'}
                                                            </span>
                                                        )}
                                                    </div>
                                                )}
                                            </td>
                                            <td>
                                                <div><strong>{t.numer_fv}</strong></div>
                                                {t.nip && (
                                                    <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>
                                                        NIP: {t.nip}
                                                    </div>
                                                )}
                                            </td>
                                            <td>
                                                <StatusControl
                                                    ticket={t}
                                                    user={user}
                                                    onUpdateStatus={handleUpdateStatus}
                                                    onOpenRepairModal={ticketToRepair => setRepairModalTicket(ticketToRepair)}
                                                />
                                            </td>
                                            <td>
                                                <small>
                                                    {t.created_at ? new Date(t.created_at).toLocaleString('pl-PL') : '-'}
                                                </small>
                                                {t.data_wyslania && (
                                                    <div style={{ marginTop: '4px', fontSize: '0.75rem', color: 'var(--primary)', fontWeight: 600 }}>
                                                        Wysłano: {t.data_wyslania}
                                                    </div>
                                                )}
                                                {t.numer_listu && (
                                                    <div style={{ marginTop: '2px', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                                                        List: <strong style={{ color: 'var(--text)', wordBreak: 'break-all' }}>{t.numer_listu}</strong>
                                                    </div>
                                                )}
                                            </td>
                                            <td>
                                                {user?.role === 'admin' ? (
                                                    <button
                                                        className="btn-delete"
                                                        disabled={deletingId === t.id}
                                                        onClick={() => handleDeleteTicket(t.id)}
                                                        title={`Usuń zgłoszenie #${t.id}`}
                                                    >
                                                        {deletingId === t.id ? (
                                                            'Usuwanie...'
                                                        ) : (
                                                            <>
                                                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle', marginRight: '3px' }}>
                                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                                                </svg>
                                                                Usuń
                                                            </>
                                                        )}
                                                    </button>
                                                ) : (
                                                    <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>—</span>
                                                )}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    <RepairModal
                        ticket={repairModalTicket}
                        onClose={() => setRepairModalTicket(null)}
                        onSubmit={handleRepairSubmit}
                    />
                    </>
                    )}

                    {/* Modal zmiany własnego hasła (dostępny dla każdego zalogowanego) */}
                    {showOwnPasswordModal && (
                        <ChangeOwnPasswordModal
                            onClose={() => setShowOwnPasswordModal(false)}
                            apiJson={apiJson}
                            showAlert={showAlert}
                        />
                    )}
                </div>
            );
        }

        // Główny komponent aplikacji
        function App() {
            const [activeTab, setActiveTab] = useState('public');
            const [token, setToken] = useState(() => localStorage.getItem('serwis_token') || null);
            const [user, setUser] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('serwis_user') || 'null');
                } catch {
                    return null;
                }
            });

            function handleLoginSuccess(newToken, newUser) {
                localStorage.setItem('serwis_token', newToken);
                localStorage.setItem('serwis_user', JSON.stringify(newUser));
                setToken(newToken);
                setUser(newUser);
            }

            function handleLogout() {
                localStorage.removeItem('serwis_token');
                localStorage.removeItem('serwis_user');
                setToken(null);
                setUser(null);
            }

            return (
                <>
                    <Header activeTab={activeTab} setActiveTab={setActiveTab} />

                    <main className={activeTab !== 'public' && token ? 'container-dashboard' : 'container'}>
                        {activeTab === 'public' ? (
                            <PublicTicketForm />
                        ) : token ? (
                            <Dashboard user={user} token={token} onLogout={handleLogout} />
                        ) : (
                            <LoginForm onLoginSuccess={handleLoginSuccess} />
                        )}
                    </main>
                </>
            );
        }

        // Renderowanie drzewa komponentów React w elemencie #root
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>

</html>
