<!DOCTYPE html>
<html lang="pl">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- React, ReactDOM oraz Babel Standalone -->

<body>
    <!-- Główny punkt montowania aplikacji React -->
    <div id="root"></div>

    <!-- Kod aplikacji React napisany w JSX -->
    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_BASE = '/api';

        // Komponent powiadomień Alert
        function Alert({ alert }) {
            if (!alert) return null;
            return (
                <div className={`alert alert-${alert.type}`}>
                    {alert.message}
                </div>
            );
        }

        // Komponent nagłówka z nawigacją
        function Header({ activeTab, setActiveTab }) {
            return (
                <header>
                    <div className="brand">
                        <img src="logo_mentor4.svg" width="200px" height="auto" alt="logo firmy" />
                    </div>
                    <div className="nav-tabs">
                        <button
                            className={`nav-btn ${activeTab === 'public' ? 'active' : ''}`}
                            onClick={() => setActiveTab('public')}
                        >
                            Nowe zgłoszenie
                        </button>
                        <button
                            className={`nav-btn ${activeTab === 'admin' ? 'active' : ''}`}
                            onClick={() => setActiveTab('admin')}
                        >
                            Panel pracownika
                        </button>
                    </div>
                </header>
            );
        }

        // =========================================================================
        // LISTA PRZEDMIOTÓW ZGŁOSZENIA
        // =========================================================================
        const PRZEDMIOTY_LISTA = [
            'Monitor interaktywny myBoard Titan (Android 15)',
            'Monitor interaktywny myBoard Grey Arrow (Android 13)',
            'Monitor interaktywny myBoard Panda (Android 13)',
            'Monitor interaktywny myBoard Black Arrow (Android 13)',
            'Monitor interaktywny myBoard Grey Rock (Android 11)',
            'Monitor interaktywny myBoard Grey Rock 2.0 (Android 11)',
            'Monitor interaktywny myBoard White Arrow (Android 14)',
            'Monitor interaktywny myBoard Panda 2.0 (Android 14)',
            'Monitor interaktywny myBoard Black (Android 8)',
            'Monitor interaktywny myBoard Silver (Android 9)',
            'Monitor interaktywny myBoard Grey UP (Android 8)',
            'Monitor interaktywny (Model spoza listy)',
            'Tablica interaktywna myBoard Silver',
            'Tablica interaktywna myBoard Black',
            'Akcesoria do tablic interaktywnych myBoard',
            'Akcesoria dla monitorów interaktywnych myBoard',
            'Pracownie językowe',
            'Podłoga interaktywna SmartFloor',
            'Meble',
            'Systemy konferencyjne',
            'Projektory',
            'Laptop',
            'Inne'
        ];

        // Pomocnik: sprawdza czy dla wybranego przedmiotu dozwolony jest numer seryjny
        // (wyłącznie monitory interaktywne i tablice interaktywne, z wyłączeniem akcesoriów)
        function isSerialNumberAllowed(product) {
            if (!product) return false;
            const lower = product.toLowerCase();
            const isMonitor = lower.includes('monitor interaktywny') && !lower.includes('akcesoria');
            const isTablica = lower.includes('tablica interaktywna') && !lower.includes('akcesoria');
            return isMonitor || isTablica;
        }

        function validatePurchaseDate(dateStr) {
            if (!dateStr || typeof dateStr !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return 'Proszę wybrać datę zakupu sprzętu z kalendarza.';
            }
            const [year, month, day] = dateStr.split('-').map(Number);
            const parsedDate = new Date(Date.UTC(year, month - 1, day));
            if (
                isNaN(parsedDate.getTime()) ||
                parsedDate.getUTCFullYear() !== year ||
                (parsedDate.getUTCMonth() + 1) !== month ||
                parsedDate.getUTCDate() !== day
            ) {
                return 'Pole "Data zakupu" zawiera nieprawidłową datę (nie istnieje w kalendarzu).';
            }
            const now = new Date();
            const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
            if (parsedDate > today) {
                return 'Data zakupu nie może być datą z przyszłości.';
            }
            return null;
        }

        // LISTA 49 POLSKICH NUMERÓW KIERUNKOWYCH (STREF NUMERACYJNYCH)
        const NUMERY_KIERUNKOWE_PL = [
            { code: '12', miasto: 'Kraków' },
            { code: '13', miasto: 'Krosno' },
            { code: '14', miasto: 'Tarnów' },
            { code: '15', miasto: 'Tarnobrzeg' },
            { code: '16', miasto: 'Przemyśl' },
            { code: '17', miasto: 'Rzeszów' },
            { code: '18', miasto: 'Nowy Sącz' },
            { code: '22', miasto: 'Warszawa' },
            { code: '23', miasto: 'Ciechanów' },

        // Formularz publiczny dodawania zgłoszenia
        function PublicTicketForm() {
            const [formData, setFormData] = useState(EMPTY_FORM);
            const [loading, setLoading] = useState(false);
            const [alert, setAlert] = useState(null);

            function showAlert(message, type = 'success') {
                setAlert({ message, type });
                setTimeout(() => setAlert(null), 6000);
            }

            // Obsługa wpisywania numeru telefonu (i wyłącznie cyfry)
            function handlePhoneChange(e) {
                let val = e.target.value;
                let digits = val.replace(/\D/g, '');

                if (digits.startsWith('48')) {
                    digits = digits.slice(2);
                }
                digits = digits.slice(0, 9);

                const formatted = '+48 ' + [digits.slice(0, 3), digits.slice(3, 6), digits.slice(6)].filter(Boolean).join(' ');

                setFormData(prev => ({ ...prev, numer_telefonu: formatted }));
            }

            function handlePhoneKeyDown(e) {
                if ((e.key === 'Backspace' || e.key === 'Delete') && e.target.selectionStart <= 4 && e.target.selectionEnd <= 4) {
                    e.preventDefault();
                }
            }

            // Obsługa wpisywania 7 cyfr telefonu firmowego (tylko cyfry, max 7)
            function handleCompanyPhone7Change(e) {
                const digits = e.target.value.replace(/\D/g, '').slice(0, 7);
                setFormData(prev => ({ ...prev, telefon_firmowy_7: digits }));
            }

            // Obsługa wpisywania kodu pocztowego (tylko cyfry, format XX-XXX z automatycznym myślnikiem)
            function handlePostalCodeChange(e) {
                const val = e.target.value;
                // Wyodrębnij wyłącznie cyfry, maksymalnie 5 cyfr
                const digits = val.replace(/\D/g, '').slice(0, 5);

                let formatted = digits;
                if (digits.length > 2) {
                    formatted = `${digits.slice(0, 2)}-${digits.slice(2)}`;
                } else if (digits.length === 2 && val.length === 2 && e.nativeEvent?.inputType !== 'deleteContentBackward') {
                    formatted = `${digits}-`;
                }

                setFormData(prev => ({ ...prev, kod_pocztowy: formatted }));
            }

            function handlePostalCodeKeyDown(e) {
                if (e.key === 'Backspace' && formData.kod_pocztowy.endsWith('-')) {
                    e.preventDefault();
                    setFormData(prev => ({ ...prev, kod_pocztowy: prev.kod_pocztowy.slice(0, -2) }));
                }
            }

            // Obsługa wpisywania numeru NIP (tylko cyfry, dokładnie do 10 cyfr, bez myślników)
            function handleNipChange(e) {
                const digits = e.target.value.replace(/\D/g, '').slice(0, 10);
                setFormData(prev => ({ ...prev, nip: digits }));
            }

            // Obsługa zmiany przedmiotu zgłoszenia (czyści numer seryjny jeśli nie jest dozwolony)
            function handleSubjectChange(e) {
                const val = e.target.value;
                const allowed = isSerialNumberAllowed(val);
                setFormData(prev => ({
                    ...prev,
                    przedmiot_zgloszenia: val,
                    numer_seryjny: allowed ? prev.numer_seryjny : ''
                }));
            }

            // Czyszczenie wszystkich danych wprowadzonych do formularza
            function handleReset() {
                setFormData(EMPTY_FORM);
                setAlert(null);
            }

            async function handleSubmit(e) {
                e.preventDefault();

                // Walidacje w kolejności sprawdzania – pierwszy błąd przerywa wysyłkę
                const cleanDigits = formData.numer_telefonu.replace(/\D/g, '').replace(/^48/, '');
                const validationError = [
                    // imię i nazwisko bez cyfr
                    [/\d/.test(formData.imie), 'Pole "Imię" nie może zawierać cyfr.'],
                    [/\d/.test(formData.nazwisko), 'Pole "Nazwisko" nie może zawierać cyfr.'],
                    // numer telefonu (co najmniej 9 cyfr po +48)
                    [cleanDigits.length < 9, 'Proszę podać pełny, 9-cyfrowy numer telefonu po prefiksie +48.'],
                    // kod pocztowy (XX-XXX)
                    [!/^\d{2}-\d{3}$/.test(formData.kod_pocztowy.trim()), 'Kod pocztowy musi mieć format XX-XXX (np. 00-001).'],
                    // województwo i przedmiot zgłoszenia
                    [!formData.wojewodztwo, 'Proszę wybrać województwo z listy.'],
                    [!formData.przedmiot_zgloszenia, 'Proszę wybrać przedmiot zgłoszenia z listy.'],
                    // numer seryjny (obowiązkowy, jeśli aktywny dla przedmiotu)
                    [isSerialNumberAllowed(formData.przedmiot_zgloszenia) && !formData.numer_seryjny.trim(), 'Pole "Numer seryjny (S/N)" jest obowiązkowe dla wybranego przedmiotu zgłoszenia.'],
                    // data zakupu i numer faktury / paragonu
                    [Boolean(validatePurchaseDate(formData.data_zakupu)), validatePurchaseDate(formData.data_zakupu)],
                    [!formData.numer_fv.trim(), 'Pole "Numer faktury / paragonu" jest wymagane.'],
                    // NIP (wymagany, dokładnie 10 cyfr bez myślników)
                    [!/^\d{10}$/.test(formData.nip.trim()), 'Pole "NIP" jest wymagane i musi składać się z dokładnie 10 cyfr (bez myślników).'],
                    // telefon firmowy (obowiązkowy)
                    [!formData.telefon_kierunkowy, 'Proszę wybrać 2-cyfrowy numer kierunkowy dla telefonu firmowego.'],
                    [formData.telefon_firmowy_7.length < 7, 'Dla telefonu firmowego należy podać pełne 7 cyfr po numerze kierunkowym.']
                ].find(([invalid]) => invalid);
                if (validationError) {
                    showAlert(validationError[1], 'error');
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(`${API_BASE}/zgloszenia`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            imie: formData.imie,
                            nazwisko: formData.nazwisko,
                            nazwa_firmy: formData.nazwa_firmy ? formData.nazwa_firmy.trim() : null,
                            numer_telefonu: formData.numer_telefonu.replace(/\s+/g, ''),
                            email: formData.email,
                            adres: formData.adres,
                            kod_pocztowy: formData.kod_pocztowy.trim(),
                            miasto: formData.miasto.trim(),
                            wojewodztwo: formData.wojewodztwo,
                            przedmiot_zgloszenia: formData.przedmiot_zgloszenia,
                            numer_seryjny: isSerialNumberAllowed(formData.przedmiot_zgloszenia) && formData.numer_seryjny ? formData.numer_seryjny.trim() : null,
                            data_zakupu: formData.data_zakupu,
                            numer_fv: formData.numer_fv.trim(),
                            nip: formData.nip.trim(),
                            opis_usterki: formData.opis_usterki
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Błąd podczas wysyłania zgłoszenia.');
                    }

                    showAlert(`Dziękujemy! ${data.message} Numer zgłoszenia: #${data.id}`, 'success');
                    setFormData({ ...EMPTY_FORM, numer_telefonu: '+48 ' });
                } catch (err) {
                    showAlert(err.message, 'error');
                } finally {
                    setLoading(false);
                }
            }

            const isSnActive = isSerialNumberAllowed(formData.przedmiot_zgloszenia);

            return (
                <main className="card">
                    <div className="card-header">
                        <h2 className="card-title">Zgłoś problem</h2>
                        <p className="card-subtitle">Wypełnij poniższy formularz. Skontaktujemy się z Tobą po przyjęciu zgłoszenia.</p>
                    </div>

                    <Alert alert={alert} />

                    <form onSubmit={handleSubmit}>
                        {/* Część 1: Dane osoby zgłaszającej */}
                        <section className="form-section">
                            <div className="form-section-header">
                                <span className="form-section-badge">1</span>
                                <h3 className="form-section-title">Dane osoby zgłaszającej</h3>
                            </div>
                            <div className="form-grid">
                                <div className="form-group">
                                    <label htmlFor="imie">Imię *</label>
                                    <input
                                        type="text"
                                        id="imie"
                                        required
                                        placeholder="np. Jan"
                                        value={formData.imie}
                                        onChange={e => setFormData({ ...formData, imie: e.target.value })}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="nazwisko">Nazwisko *</label>
                                    <input
                                        type="text"
                                        id="nazwisko"
                                        required
                                        placeholder="np. Kowalski"
                                        value={formData.nazwisko}
                                        onChange={e => setFormData({ ...formData, nazwisko: e.target.value })}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="numer_telefonu">Telefon kontaktowy *</label>
                                    <input
                                        type="tel"
                                        id="numer_telefonu"
                                        required
                                        maxLength="15"
                                        placeholder="+48 500 600 700"
                                        value={formData.numer_telefonu}
                                        onChange={handlePhoneChange}
                                        onKeyDown={handlePhoneKeyDown}
                                        onFocus={e => {
                                            if (!e.target.value || e.target.value.trim() === '+48') {
                                                setFormData(prev => ({ ...prev, numer_telefonu: '+48 ' }));
                                            }
                                        }}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="email">E-mail *</label>
                                    <input
                                        type="email"
                                        id="email"
                                        required
                                        placeholder="np. jan.kowalski@example.com"
                                        value={formData.email}
                                        onChange={e => setFormData({ ...formData, email: e.target.value })}
                                    />
                                </div>
                            </div>
                        </section>

                        {/* Część 2: Dane firmy */}
                        <section className="form-section">
                            <div className="form-section-header">
                                <span className="form-section-badge">2</span>
                                <h3 className="form-section-title">Dane firmy</h3>
                            </div>
                            <div className="form-grid">
                                <div className="form-group full">
                                    <label htmlFor="nazwa_firmy">Nazwa firmy (opcjonalnie)</label>
                                    <input
                                        type="text"
                                        id="nazwa_firmy"
                                        placeholder="np. Kowalski Sp. z o.o."
                                        value={formData.nazwa_firmy}
                                        onChange={e => setFormData({ ...formData, nazwa_firmy: e.target.value })}
                                    />
                                </div>
                                <div className="form-group full">
                                    <label htmlFor="adres">Adres *</label>
                                    <input
                                        type="text"
                                        id="adres"
                                        required
                                        placeholder="np. ul. Lipowa 12/4"
                                        value={formData.adres}
                                        onChange={e => setFormData({ ...formData, adres: e.target.value })}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="kod_pocztowy">Kod pocztowy * (tylko cyfry, XX-XXX)</label>
                                    <input
                                        type="text"
                                        id="kod_pocztowy"
                                        required
                                        inputMode="numeric"
                                        maxLength="6"
                                        placeholder="00-000"
                                        value={formData.kod_pocztowy}
                                        onChange={handlePostalCodeChange}
                                        onKeyDown={handlePostalCodeKeyDown}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="miasto">Miasto *</label>
                                    <input
                                        type="text"
                                        id="miasto"
                                        required
                                        placeholder="np. Warszawa"
                                        value={formData.miasto}
                                        onChange={e => setFormData({ ...formData, miasto: e.target.value })}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="wojewodztwo">Województwo *</label>
                                    <select
                                        id="wojewodztwo"
                                        required
                                        value={formData.wojewodztwo}
                                        onChange={e => setFormData({ ...formData, wojewodztwo: e.target.value })}
                                    >
                                        <option value="">-- Wybierz województwo --</option>
                                        {WOJEWODZTWA.map(w => (
                                            <option key={w} value={w}>{w.charAt(0).toUpperCase() + w.slice(1)}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label htmlFor="nip">NIP * (10 cyfr, bez myślników)</label>
                                    <input
                                        type="text"
                                        id="nip"
                                        required
                                        inputMode="numeric"
                                        maxLength="10"
                                        placeholder="np. 1234567890 (bez myślników)"
                                        value={formData.nip}
                                        onChange={handleNipChange}
                                    />
                                </div>
                                {/* Telefon firmowy / stacjonarny — obowiązkowy */}
                                <div className="form-group full">
                                    <label htmlFor="telefon_kierunkowy">
                                        Telefon firmowy / stacjonarny *
                                    </label>
                                    <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'flex-start', flexWrap: 'wrap' }}>
                                        {/* Wybór numeru kierunkowego */}
                                        <div style={{ flex: '1 1 220px' }}>
                                            <select
                                                id="telefon_kierunkowy"
                                                value={formData.telefon_kierunkowy}
                                                onChange={e => setFormData({ ...formData, telefon_kierunkowy: e.target.value })}
                                            >
                                                <option value="">-- Kierunkowy (2 cyfry) --</option>
                                                {NUMERY_KIERUNKOWE_PL.map(item => (
                                                    <option key={item.code} value={item.code}>
                                                        ({item.code}) {item.miasto}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                        {/* Pole 7 cyfr */}
                                        <div style={{ flex: '2 1 240px' }}>
                                            <input
                                                type="text"
                                                id="telefon_firmowy_7"
                                                inputMode="numeric"
                                                maxLength="7"
                                                placeholder="Pozostałe 7 cyfr (np. 1234567)"
                                                value={formData.telefon_firmowy_7}
                                                onChange={handleCompanyPhone7Change}
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Część 3: Zgłaszana usterka */}
                        <section className="form-section">
                            <div className="form-section-header">
                                <span className="form-section-badge">3</span>
                                <h3 className="form-section-title">Zgłaszana usterka</h3>
                            </div>
                            <div className="form-grid">
                                <div className="form-group">
                                    <label htmlFor="data_zakupu">Data zakupu *</label>
                                    <input
                                        type="date"
                                        id="data_zakupu"
                                        required
                                        max={new Date().toISOString().split('T')[0]}
                                        value={formData.data_zakupu}
                                        onChange={e => setFormData({ ...formData, data_zakupu: e.target.value })}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="numer_fv">Numer faktury / paragonu *</label>
                                    <input
                                        type="text"
                                        id="numer_fv"
                                        required
                                        placeholder="np. FV/2026/04/1234"
                                        value={formData.numer_fv}
                                        onChange={e => setFormData({ ...formData, numer_fv: e.target.value })}
                                    />
                                </div>
                                <div className="form-group">
                                    <label htmlFor="przedmiot_zgloszenia">Przedmiot zgłoszenia *</label>
                                    <select
                                        id="przedmiot_zgloszenia"
                                        required
                                        value={formData.przedmiot_zgloszenia}
                                        onChange={handleSubjectChange}
                                    >
                                        <option value="">-- Wybierz przedmiot zgłoszenia --</option>
                                        {PRZEDMIOTY_LISTA.map(item => (
                                            <option key={item} value={item}>{item}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="form-group">
                                    <label htmlFor="numer_seryjny">
                                        Numer seryjny (S/N) {isSnActive ? (
                                            <span style={{ color: '#dc2626', fontWeight: 600 }}>* (wymagany)</span>
                                        ) : (
                                            <span style={{ color: '#6b7280', fontWeight: 'normal', fontSize: '0.8rem' }}>(tylko dla monitorów i tablic)</span>
                                        )}
                                    </label>
                                    <input
                                        type="text"
                                        id="numer_seryjny"
                                        required={isSnActive}
                                        disabled={!isSnActive}
                                        placeholder={isSnActive ? 'np. SN123456789 (pole wymagane)' : 'Dostępne tylko dla monitorów i tablic'}
                                        value={formData.numer_seryjny}
                                        onChange={e => setFormData({ ...formData, numer_seryjny: e.target.value })}
                                        style={!isSnActive ? { backgroundColor: '#f3f4f6', cursor: 'not-allowed', color: '#9ca3af' } : {}}
                                    />
                                </div>
                                <div className="form-group full">
                                    <label htmlFor="opis_usterki">Dokładny opis usterki *</label>
                                    <textarea
                                        id="opis_usterki"
                                        required
                                        placeholder="Opisz objawy, okoliczności powstania awarii oraz model urządzenia..."
                                        value={formData.opis_usterki}
                                        onChange={e => setFormData({ ...formData, opis_usterki: e.target.value })}
                                    />
                                </div>
                            </div>
                        </section>

                        <div className="form-actions">
                            <button type="submit" className="btn-submit" disabled={loading}>
                                {loading ? 'Wysyłanie...' : 'Wyślij zgłoszenie'}
                            </button>
                            <button
                                type="button"
                                className="btn-reset"
                                onClick={handleReset}
                                disabled={loading}
                                title="Wyczyść wszystkie dane z formularza"
                            >
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ verticalAlign: 'middle' }}>
                                    <path d="M3 6h18"></path>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                                Wyczyść
                            </button>
                        </div>
                    </form>
                </main>
            );
        }

        // Formularz logowania pracownika
        function LoginForm({ onLoginSuccess }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [alert, setAlert] = useState(null);

            async function handleSubmit(e) {
                e.preventDefault();
                setLoading(true);
                setAlert(null);

                try {
                    const response = await fetch(`${API_BASE}/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error || 'Nieprawidłowe dane logowania.');
                    }

                    onLoginSuccess(data.token, data.user);
                } catch (err) {
                    setAlert({ message: err.message, type: 'error' });
                } finally {
                    setLoading(false);
                }
            }

            return (
                <div className="card login-box">
                    <div className="card-header">
                        <h2 className="card-title">Logowanie do panelu</h2>
                        <p className="card-subtitle">Dostęp tylko dla uprawnionych pracowników serwisu</p>
                    </div>

                    <Alert alert={alert} />

                    <form onSubmit={handleSubmit}>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                            <div>
                                <label htmlFor="loginUsername">Nazwa użytkownika</label>
                                <input
                                    type="text"
                                    id="loginUsername"
                                    required

        // Modal opisu naprawy z automatycznym datowaniem
        function RepairModal({ ticket, onClose, onSubmit }) {
            const [opis, setOpis] = useState(ticket?.opis_naprawy || '');
            const [submitting, setSubmitting] = useState(false);
            const [modalError, setModalError] = useState(null);

            useEffect(() => {
                setOpis(ticket?.opis_naprawy || '');
                setModalError(null);
            }, [ticket]);

            if (!ticket) return null;

            async function handleSubmit(e) {
                e.preventDefault();
                setModalError(null);
                if (!opis.trim()) {
                    setModalError('Podaj opis wykonanych prac naprawczych.');
                    return;
                }
                setSubmitting(true);
                try {
                    await onSubmit(ticket.id, opis.trim());
                } catch (err) {
                    setModalError(err.message || 'Wystąpił błąd podczas zatwierdzania naprawy.');
                } finally {
                    setSubmitting(false);
                }
            }

            return (
                <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="modal-card">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                            <h3 style={{ margin: 0, fontSize: '1.15rem', color: '#ffffff' }}>
                                Raport z naprawy — Zgłoszenie #{ticket.id}
                            </h3>
                            <button
                                type="button"
                                onClick={onClose}
                                style={{ background: 'transparent', border: 'none', color: '#ff0000', fontSize: '1.25rem', cursor: 'pointer' }}
                            >
                                ✕
                            </button>
                        </div>

                        <div style={{ background: 'rgba(255,255,255,0.9)', padding: '0.75rem', borderRadius: '8px', marginBottom: '1rem', fontSize: '0.85rem' }}>
                            <div><strong>Klient:</strong> {ticket.imie} {ticket.nazwisko} {ticket.nazwa_firmy ? `(${ticket.nazwa_firmy})` : ''}</div>
                            <div><strong>Produkt:</strong> {ticket.przedmiot_zgloszenia} {ticket.numer_seryjny ? `| SN: ${ticket.numer_seryjny}` : ''}</div>
                            <div style={{ marginTop: '0.35rem', color: 'var(--text-muted)', whiteSpace: 'pre-wrap', wordBreak: 'break-word', lineHeight: '1.45' }}>
                                <strong>Zgłoszona usterka:</strong> {ticket.opis_usterki}

                        </div>

                            <div className="alert alert-error" style={{ marginBottom: '1rem' }}>
                                {modalError}

                                </label>

                                    id="repairDescription"
                                    required
                                    rows="6"
                                    placeholder="np. Wymieniono moduł zasilacza, przetestowano ekran dotykowy, wgrano aktualizację firmware..."
                                    value={opis}
                                    onChange={e => setOpis(e.target.value)}
                                    style={{ width: '100%', resize: 'vertical', fontSize: '0.88rem', lineHeight: '1.45', padding: '0.6rem' }}

                </div>

        // Komponent wysyłki z polem na numer listu przewozowego (dla magazyniera)
        function ShipControl({ ticket, onUpdateStatus }) {
            const [numer, setNumer] = React.useState('');
            const [sending, setSending] = React.useState(false);
            const [touched, setTouched] = React.useState(false);

            const trimmed = numer.trim();
            const isEmpty = !trimmed;
            const isTooLong = trimmed.length > 100;
            const showErrorEmpty = touched && isEmpty;
            const showErrorTooLong = trimmed.length > 100;
            const hasError = showErrorEmpty || showErrorTooLong;

            async function handleShip() {
                setTouched(true);
                if (isEmpty || isTooLong) return;
                setSending(true);
                try {
                    await onUpdateStatus(ticket.id, 'zakończone', { numer_listu: trimmed });
                } finally {
                    setSending(false);
                }
            }

            return (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.25rem' }}>
                    <input
                        type="text"
                        placeholder="Nr listu przewozowego *"
                        value={numer}
                        onChange={e => setNumer(e.target.value)}
                        onBlur={() => setTouched(true)}
                        style={{
                            fontSize: '0.78rem',
                            padding: '4px 8px',
                            borderRadius: '6px',
                            border: hasError ? '1px solid #ef4444' : '1px solid var(--border)',
                            background: hasError ? 'rgba(239,68,68,0.07)' : 'var(--input-bg)',
                            color: 'var(--text)',
                            width: '100%',
                            minWidth: '0',
                            transition: 'border 0.15s, background 0.15s'
                        }}
                    />
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        {showErrorEmpty && (
                            <span style={{ fontSize: '0.72rem', color: '#ef4444', fontWeight: 500 }}>
                                Numer listu przewozowego jest wymagany.
                            </span>
                        )}
                        {showErrorTooLong && (
                            <span style={{ fontSize: '0.72rem', color: '#ef4444', fontWeight: 500 }}>
                                Maks. 100 znaków (wpisano: {trimmed.length}).
                            </span>
                        )}
                        {numer.length > 0 && (
                            <span style={{ fontSize: '0.68rem', color: isTooLong ? '#ef4444' : 'var(--text-muted)', marginLeft: 'auto', fontWeight: isTooLong ? 600 : 400 }}>
                                {numer.length}/100
                            </span>
                        )}
                    </div>
                    <button
                        type="button"
                        className="btn-ship"
                        disabled={sending || isEmpty || isTooLong}
                        onClick={handleShip}
                        style={{ opacity: (isEmpty || isTooLong) ? 0.5 : 1, cursor: (isEmpty || isTooLong) ? 'default' : 'pointer' }}
                        title="Podaj numer listu i oznacz jako wysłane do klienta"
                    >
                        {sending ? 'Zapisywanie...' : 'Oznacz jako wysłane'}
                    </button>
                </div>
            );
        }
