name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: serwis_db_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: serwis_db_test
      JWT_SECRET: super_tajny_klucz_jwt_do_testow_ci_1234567890

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj środowisko Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Zainstaluj zależności
        run: npm ci

      - name: Sprawdź kod linterem (oxlint)
        run: npm run lint

      - name: Zbuduj aplikację frontendową (Vite)
        run: npm run build

      - name: Zaaplikuj migracje bazy danych
        run: npm run migrate

      - name: Uruchom testy jednostkowe API (mock)
        run: npm test

      - name: Uruchom testy integracyjne na prawdziwej bazie danych MariaDB
        run: npm run test:db
